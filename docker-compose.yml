services:
  # ==========================================
  # 1. 本地 MySQL 8.0 服务 (包含 meta 与 dw 库)
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: text2sql-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "duoceshi123"
      TZ: "Asia/Shanghai"
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      # 容器启动时自动执行 SQL 初始化脚本创建 meta 和 dw 数据库及表结构
      - ./mysql/init_local.sql:/docker-entrypoint-initdb.d/init_local.sql:ro
      - mysql_data:/var/lib/mysql

  # ==========================================
  # 2. 本地 Qdrant 向量数据库服务
  # ==========================================
  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: text2sql-qdrant
    restart: always
    ports:
      - "6333:6333" # REST API & Web Dashboard (http://localhost:6333/dashboard)
      - "6334:6334" # gRPC 端口
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__ENABLE_CORS=true

  # ==========================================
  # 3. 本地 Elasticsearch 8.13 服务 (带 IK 中文分词)
  # ==========================================
  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: text2sql-elasticsearch
    restart: always
    ports:
      - "9200:9200" # HTTP REST 接口
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false # 开发环境关闭SSL/密码认证，方便本地无鉴权直连
      - ES_JAVA_OPTS=-Xms512m -Xmx512m # 限制JVM内存，防止吃死开发机内存
    volumes:
      - es_data:/usr/share/elasticsearch/data
      - es_plugins:/usr/share/elasticsearch/plugins
    # 启动时自动检查并安装 IK 中文分词器插件
    command: >-
      sh -c "if [ ! -d plugins/analysis-ik ]; then
        echo 'Installing analysis-ik plugin...';
        bin/elasticsearch-plugin install --batch https://get.infini.cloud/elasticsearch/analysis-ik/8.13.0 || true;
      fi;
      /bin/tini -- /usr/local/bin/docker-entrypoint.sh eswrapper"

  # ==========================================
  # 4. 本地 Embedding 向量嵌入服务 (TEI - Text Embeddings Inference)
  # ==========================================
  embedding:
    image: ai/qwen3-embedding-vllm:0.6B
    container_name: text2sql-embedding
    restart: always
    ports:
      - "12434"
    volumes:
      - tei_data:/data # 持久化模型缓存，避免容器重启后重复下载模型
    command:
      - --header
      - 'Content-Type: application/json'
      - --data
      - "{'model':'ai/qwen3-embedding-vllm'}"

volumes:
  mysql_data:
  qdrant_data:
  es_data:
  es_plugins:
  tei_data:
