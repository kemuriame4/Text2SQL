# ============================================================================
# 【文件说明】conf/app_config.yaml —— 项目"外层的具体配置值"
# 谁填：人工填。谁读：app/conf/app_config.py 里的模板类 + app/utils/load_config_util.py 负责读取和校验。
# 规则：这里的每一块（db_meta/db_dw/qdrant/...）和每个字段名，都必须和 app_config.py 里
#       对应类的字段名一模一样，否则合并时会报错或值丢失。
# 关键：db_meta 和 db_dw 是"同一台服务器（111.230.143.239）上的两个不同库"：
#       meta_1022 存元数据（表结构、字段、指标的定义），dw 存真实业务数据。
# 安全：【注意】下面的数据库密码、DeepSeek api_key 都是明文（没加密、没走环境变量），
#       只适合本地学习；正式项目应改用环境变量或密钥管理服务，且不要提交到公开仓库。
# ============================================================================
db_meta:  # 元数据库配置块（存"描述数据的数据"：表、字段、指标的定义，不是业务数据）
    host: 111.230.143.239  # 服务器 IP；和 db_dw 是同一台机器
    port: 3306  # MySQL 默认端口
    user: root  # 数据库账号（root 是最高权限账号，生产环境不建议直接用）
    password: duoceshi123  # 数据库密码：【注意】明文
    database: meta_1022  # 库名：元数据库
db_dw:  # 数仓库配置块（真正存订单、客户等业务数据，最终生成的 SQL 在这里执行）
    host: 111.230.143.239  # 同一台服务器
    port: 3306  # 同样是 MySQL 的 3306 端口
    user: root  # 同一个账号
    password: duoceshi123  # 【注意】明文，且和 db_meta 共用同一个账号密码
    database: dw  # 库名：数仓库（和上面的 meta_1022 是同一台机器上的另一个库）
qdrant:  # 向量数据库配置块（存文本向量，用于"按意思找相似内容"的语义检索）
    host: 111.230.143.239  # 服务器 IP
    port: 6333  # Qdrant 默认的 HTTP 端口
embedding:  # 向量化服务配置块（把一段文字变成 1024 个数字组成的向量）
    host: 111.230.143.239  # 服务器 IP
    port: 8081  # 服务端口
    embedding_size: 1024  # 向量维度：一条文本转成 1024 个数字；必须与 Qdrant 集合定义的维度一致
es:  # Elasticsearch 配置块（全文检索引擎，按关键词/字段值搜索）
    host: 111.230.143.239  # 服务器 IP
    port: 9200  # ES 默认端口
llm:  # 大模型配置块（这里用的是 DeepSeek）
    base_url: https://api.deepseek.com  # 接口根地址（API 网址前缀）
    api_key: sk-269500eac7594701afb39defc21ff87c  # 【注意】明文密钥，泄露后别人可以花你的额度/钱
    model: deepseek-flash  # 使用的模型名称

